[tool.ruff]
line-length = 200

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.coverage.run]
source = ["py_log_analyzer"]
omit = ["tests/*"]
